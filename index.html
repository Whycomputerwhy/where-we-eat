<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Where We Eat</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.15.0/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <div id="map" aria-label="Interactive world map"></div>
      <aside class="entry-panel">
        <form id="recipe-form">
          <p id="location-instruction">Search for a country, then select a city.</p>

          <label>
            Country
            <input id="country" name="country" list="country-options" autocomplete="off" required />
            <datalist id="country-options"></datalist>
          </label>
          <label>
            City
            <input id="city" name="city" list="city-options" autocomplete="off" disabled required />
            <datalist id="city-options"></datalist>
          </label>
          <label>
            Recipe name
            <input name="recipeName" required />
          </label>
          <label>
            Ingredients
            <textarea name="ingredients" required></textarea>
          </label>
          <label>
            Instructions
            <textarea name="instructions" required></textarea>
          </label>
          <label>
            Photos
            <input name="photos" type="file" accept="image/*" multiple />
          </label>

          <button type="submit">Add recipe</button>
          <p id="form-status" aria-live="polite"></p>
        </form>
      </aside>
    </main>
    <script type="module" src="./map.js"></script>
  </body>
</html>
