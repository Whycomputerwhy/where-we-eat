<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Where We Eat</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.15.0/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
  <!-- Logo Splash Screen -->
  <div id="splash-screen">
    <img src="./logo.png" alt="Where We Eat Logo" />
  </div>

  <header class="site-topbar">
    <img class="site-logo" src="./logo.png" alt="Where We Eat" />
    <nav class="topbar-actions" aria-label="Main navigation">
      <button id="map-view-button" class="topbar-button is-active" type="button" aria-pressed="true">Map</button>
      <button id="add-recipe-button" class="topbar-button" type="button" aria-pressed="false">Add</button>
      <button class="profile-preview" type="button" aria-label="JS profile preview">
        <img src="./food-spirit.png" alt="" />
        <span>Player</span>
      </button>
    </nav>
  </header>

  <main>
      <div id="map" aria-label="Interactive world map"></div>
      <aside class="entry-panel" aria-hidden="true">
        <form id="recipe-form">
          <label>
            Country or Region
            <span class="location-search">
              <input id="country" name="country" autocomplete="off" aria-autocomplete="list" aria-controls="country-options" aria-expanded="false" required />
              <span id="country-options" class="location-options" role="listbox" hidden></span>
            </span>
          </label>
          <label>
            City
            <span class="location-search">
              <input id="city" name="city" autocomplete="off" aria-autocomplete="list" aria-controls="city-options" aria-expanded="false" disabled required />
              <span id="city-options" class="location-options" role="listbox" hidden></span>
            </span>
          </label>
          <label>
            Recipe name
            <input name="recipeName" required />
          </label>
          <label>
            Ingredients
            <textarea name="ingredients" required></textarea>
          </label>
          <label>
            Instructions
            <textarea name="instructions" required></textarea>
          </label>
          <label>
            Photos
            <input name="photos" type="file" accept=".jpg,.jpeg,.png,.webp,.gif,.avif,.heic,.heif,image/jpeg,image/png,image/webp,image/gif,image/avif,image/heic,image/heif" multiple />
          </label>

          <button type="submit">Add recipe</button>
          <p id="form-status" aria-live="polite"></p>
        </form>
      </aside>
    </main>
    <div id="recipe-overlay" class="recipe-overlay" aria-hidden="true">
      <section class="recipe-view" role="dialog" aria-modal="true" aria-labelledby="recipe-view-title">
        <button id="close-recipe-view" class="close-recipe-view" type="button" aria-label="Close recipe">×</button>
        <div class="recipe-view-left">
          <p id="recipe-view-location" class="recipe-view-location"></p>
          <h2 id="recipe-view-title"></h2>
          <p id="recipe-view-submitter" class="recipe-view-submitter" hidden></p>
          <div id="recipe-view-photos" class="recipe-view-photos"></div>
          <h3>Ingredients</h3>
          <p id="recipe-view-ingredients" class="recipe-view-text"></p>
        </div>
        <div class="recipe-view-right">
          <h3>Instructions</h3>
          <p id="recipe-view-instructions" class="recipe-view-text"></p>
        </div>
      </section>
    </div>
    <!-- NPC Introduction -->
<div id="intro-overlay" class="intro-overlay" hidden>
  <div class="dialogue-box">

    <img
  id="npc-image"
  src="./food-spirit.png"
  alt="Food Spirit"
/>

    <div class="dialogue-content">
      <h3 id="npc-name">Food Spirit</h3>
      <p id="npc-text"></p>

      <button id="next-dialogue" type="button">
        Next →
      </button>
    </div>

  </div>
</div>
    <script type="module" src="./map.js"></script>
<script type="module" src="./dialogue.js"></script>
    <script type="module" src="./splash.js"></script>
  </body>
</html>
